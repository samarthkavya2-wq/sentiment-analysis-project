{#
register.html — Professional Registration Screen
#}
{% extends 'base.html' %}

{% block title %}Create Account - SentixAI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="auth-header">
            <div class="auth-icon-bubble icon-bubble-purple">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Create New Account</h2>
            <p class="auth-subtitle">Initialize your researcher access credentials</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fa-regular fa-user"></i> Preferred Username</label>
                <div class="input-with-icon">
                    <input type="text" id="username" name="username" 
                           placeholder="Choose a distinct username" required minlength="3" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <div class="input-with-icon">
                    <input type="email" id="email" name="email" 
                           placeholder="name@university.edu or email@domain.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-key"></i> Security Password</label>
                <div class="input-with-icon">
                    <input type="password" id="password" name="password" 
                           placeholder="Create secure password (min 4 characters)" required minlength="4" autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg">
                <span>Complete Registration</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer-divider">
            <span>Already registered?</span>
        </div>

        <div class="auth-bottom-action">
            <a href="{{ url_for('login') }}" class="btn btn-outline btn-full">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Existing Account
            </a>
        </div>
    </div>
</div>
{% endblock %}
